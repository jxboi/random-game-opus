<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knights &amp; Merchants</title>
<meta name="description" content="A browser remake of the classic medieval economy and war strategy game.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">⚜ Knights &amp; Merchants</div>
    <div id="topbar-stats"></div>
    <div class="ctl">
      <button id="btn-pause" title="Pause (Space)">⏸</button>
      <button data-speed="1" title="Normal speed (1)">1×</button>
      <button data-speed="2" title="Fast (2)">2×</button>
      <button data-speed="4" title="Faster (3)">4×</button>
      <button id="btn-mute" title="Sound on/off">🔊</button>
      <button id="btn-menu" title="Menu">☰</button>
    </div>
  </header>
  <main id="main">
    <div id="stage">
      <div id="banner"></div>
      <div id="tip"></div>
    </div>
    <aside id="panel">
      <canvas id="minimap" width="192" height="192"></canvas>
      <nav id="tabs">
        <button data-tab="build" class="on">🔨 Build</button>
        <button data-tab="stock">📦 Stock</button>
        <button data-tab="army">⚔ Army</button>
        <button data-tab="guide">📜 Guide</button>
      </nav>
      <div id="panel-body"></div>
      <div id="messages"></div>
    </aside>
  </main>
  <div id="overlay"></div>
</div>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.min.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
